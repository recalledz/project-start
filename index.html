<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <title>Page Title</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/pixi.js-legacy@7.4.3/dist/pixi-legacy.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-filters@4/dist/pixi-filters.umd.js"></script>
</head>
  <body>
    <!--<div id="insanityOrb" class="insanity-orb" title="The mind frays..."></div>-->
    <button id="debugToggle" class="debug-toggle">Debug</button>
    <div id="debugPanel" style="display:none;">
      <label>Cash: <input id="debugCash" type="number" value="10000" style="width: 60px;"></label>
      <button onclick="devTools.giveCash()">Give</button>
      <br>

      <label>Damage Mult: <input id="debugDamageMult" type="number" value="1" step="0.1" style="width: 50px;"></label>
      <button onclick="devTools.setDamageMult()">Set</button>
      <button onclick="devTools.toggleFastMode()">Fast Mode</button>
      <br>

      <br><br>

      <button onclick="devTools.spawnBoss()">Spawn Boss</button>
      <button onclick="devTools.spawnDealer()">Spawn Dealer</button>
      <button onclick="devTools.killEnemy()">Kill Enemy</button>
      <button onclick="devTools.killBoss()">Kill Boss</button>
      <button onclick="devTools.advanceStage()">Next Stage</button>
      <button onclick="devTools.nextNight()">Next Night</button>
      <br>
      <button onclick="devTools.logEnemy()">Log Enemy</button>
      <br>
      <button onclick="devTools.save()">Save Game</button>
      <button onclick="devTools.load()">Load Game</button>
      <button onclick="devTools.unlockExploration()">Unlock Exploration</button>
      <button onclick="devTools.toggleZones()">Toggle Zones</button>
    </div>

    <!---tabs container--->
      <div class="tabsContainer">
        <button class="playerSectTabButton">sect</button>
        <button class="playerStatsTabButton">stats</button>
        <button class="playerMetamorphosisTabButton">metamorphosis</button>
        <button class="playerLexiconTabButton">lexicon</button>
        <button class="logTabButton">log</button>
      </div>
    <div class="sectTab player-sect-panel">
      <div class="colony-main">
        <div id="colonyMap" class="colony-map">
          <div class="sect-header">
            <div id="seasonBanner" class="season-banner">
              <span class="season-text"></span>
              <span class="weather-icon"></span>
            </div>
            <div id="sectDiscipleList" class="sect-disciple-list"></div>
          </div>
          <div class="colony-tabs">
            <button id="colonyResourcesTabBtn"></button>
            <button id="locationsPanelBtn"></button>
          </div>
          <div id="sectDisciplesContainer" class="sect-disciples-container">
            <div class="zone orchard"></div>
            <div class="zone lumberyard"></div>
            <div class="zone housing"></div>
            <div class="zone storage"></div>
            <div class="zone research"></div>
            <div id="qiLayer" class="qi-trails"></div>
            <div class="sect-orbs" id="sectOrbs"></div>
            <div id="sectBasket" class="sect-basket"></div>
            <div id="sectBohio" class="sect-bohio"></div>
            <div id="fruitPatch" class="fruit-patch">
              <div id="fruitBar" class="fruit-bar resource-bar">
                <div class="resource-fill fruit"></div>
              </div>
            </div>
          </div>
          <div id="resourceDisplay" class="sect-resource-display vignette open">
            <button class="vignette-toggle"><i data-lucide="chevron-down"></i></button>
            <div class="vignette-content">
              <div id="sectSummary" class="sect-summary"></div>
            </div>
          </div>
          <div id="sectNavPanel" class="sect-nav-panel">
            <button id="sectNavWorkBtn" title="Work"><i data-lucide="hammer"></i><span>Work</span></button>
            <button id="sectNavResourceBtn" title="Resources"><i data-lucide="utensils"></i><span id="resourceTimer"></span></button>
            <button id="sectNavBuildBtn" title="Build"><i data-lucide="circle"></i><span>Build</span></button>
            <button id="sectNavScheduleBtn" title="Schedule"><i data-lucide="clock"></i><span>Sched</span></button>
            <button id="sectNavChantBtn" title="Chanting"><i data-lucide="mic-2"></i><span>Chant</span></button>
            <button id="sectNavMapBtn" title="Map"><i data-lucide="map"></i><span>Map</span></button>
            <button id="sectNavInfluenceBtn" title="Influence"><i data-lucide="users"></i><span>Influence</span></button>
            <button id="sectNavResearchBtn" title="Research"><i data-lucide="flask-conical"></i><span>Research</span></button>
            <button id="sectNavOrbBtn" title="Orbs"><i data-lucide="droplet"></i><span>Orbs</span></button>
            <button id="sectNavCultivationBtn" title="Cultivation"><i data-lucide="sprout"></i><span>Cultivate</span></button>
          </div>
          <div class="raidCardContainer"></div>
        </div>
      </div>
    </div>

    <!--------------main tab panel----------------->
    <div class="mainTab">
      <div class="cardSubTab">
        <div class="dealerContainer casino-section">
          <div id="stage">
            Stage 1
          </div>
        <span id="kills">kills: 0</span>
        <!--<span id="distanceDisplay">distance: 0/0</span>-->
        <div class="dealerLifeDisplay">
          Life:10
        </div>
        <!--<div id="stageProgressBar" class="stage-progress">
          <div id="stageProgressFill" class="stage-progress-fill"></div>
        </div>-->
        <div class="dCardContainer"></div>
      </div>

      <div class="sidePanel">
        <div class="vignette stats open">
          <button class="vignette-toggle">Stats</button>
          <div class="vignette-content">
            <div class="statsSidePanel casino-section">
              <div id="combatLevelDisplay">
                Avg Combat Lv: 1
              </div>
              <div id="avgProfDisplay">
                Avg Skill Lv: 0
              </div>
              </div>
            </div>
          </div>
        </div>
        <div class="vignette resources">
          <button class="vignette-toggle"><i data-lucide="chevron-down"></i></button>
          <div class="casino-section vignette-content">
            <div id="combatResources" class="secondary-resources"></div>
          </div>
        </div>
      </div>
      <div class="gameColumn">
        <div class="buttonsContainer casino-section">
          <div id="playerAttackBar" class="playerAttackBar">
            <div class="playerAttackFill"></div>
          </div>
          <!--<button id="moveForwardBtn" title="Move Forward">➡️</button>-->
          <div class="canvasButtonsRow">
            <div id="nextStageArea" class="progress-wrapper">
              <svg class="progress-ring" width="48" height="48">
                <circle class="progress-ring-bg" cx="24" cy="24" r="22" />
                <circle id="nextStageProgress" class="progress-ring-fill" cx="24" cy="24" r="22" />
              </svg>
            </div>
            <button id="campBtn" style="display:none;" title="Find the Light"><i data-lucide="eye"></i></button>
            <div class="progress-wrapper boss-progress">
              <svg class="progress-ring" width="48" height="48">
                <circle class="progress-ring-bg" cx="24" cy="24" r="22" />
                <circle id="bossProgress" class="progress-ring-fill boss" cx="24" cy="24" r="22" />
              </svg>
              <button id="fightBossBtn" style="display:none;" title="Fight Boss">💀</button>
            </div>
          </div>
        </div>
        <div class="handContainer casino-section"></div>
      </div>
      </div>
    </div>
    <!-- close mainTab -->
    <div class="starChartTab">
      <div id="star-chart-container"></div>
    </div>
    <div class="playerStatsTab">
      <button id="themeToggle" class="theme-toggle"><i data-lucide="moon"></i> Darkenshift</button>
      <div class="stats-subtabs">
        <button class="statsOverviewSubTabButton active">Overview</button>
        <button class="statsEconomySubTabButton">Economy</button>
      </div>
      <div id="statsOverviewContainer" class="casino-section"></div>
      <div id="statsEconomyContainer" class="casino-section" style="display:none;"></div>
    </div>
    <div class="metamorphosisTab player-metamorphosis-panel" style="display:none;">
      <div class="metamorphosis-side-panel sidePanel">
        <div id="metamorphosisDiscipleList" class="sect-disciple-list"></div>
      </div>
      <div class="metamorphosis-main">
        <div id="metamorphosisTabContent"></div>
      </div>
      <div class="metamorphosis-stats-panel sidePanel">
        <div id="metamorphosisStats"></div>
      </div>
    </div>
    <div class="lexiconTab player-lexicon-panel" style="display:none;">
      <div id="tagGuide" class="tags-guide"></div>
      <div id="constructLexicon" class="construct-lexicon built-constructs"></div>
    </div>
    <div class="logTab" style="display:none;">
      <div id="log-panel" class="casino-section">
        <div id="game-log"></div>
      </div>
    </div>
    <div id="tooltip"></div>
    <script type="module" src="script.js"></script>
    <script type="module">
      window.devTools = new Proxy(
        {},
        {
          get: (_, prop) => (...args) => {
            import('./debugTools.js').then(m => {
              window.devTools = m.devTools;
              window.devTools[prop]?.(...args);
            });
          }
        }
      );
    </script>
  </body>
</html>
